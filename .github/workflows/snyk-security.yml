# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A workflow which sets up Snyk to scan Python dependencies (SCA) and source code (SAST).
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results are uploaded to GitHub Security Code Scanning.
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt 2>&1 | tee pip-install.log || true

      - name: Report uninstalled packages
        run: |
          echo "## Package Installation Report" >> "$GITHUB_STEP_SUMMARY"
          has_failures=false
          while IFS= read -r line || [ -n "$line" ]; do
            # skip blank lines and comments
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            pkg_name=$(echo "$line" | sed 's/[>=<!\[].*//' | sed 's/==.*//' | tr '[:upper:]' '[:lower:]')
            if ! pip show "$pkg_name" > /dev/null 2>&1; then
              has_failures=true
              echo "::warning::Cannot scan ${pkg_name} -- package failed to install"
              echo "- :x: \`${line}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < requirements.txt
          if [ "$has_failures" = true ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** The packages listed above could not be installed on the CI runner and were excluded from the Snyk scan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":white_check_mark: All packages from requirements.txt installed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Open Source test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          ORG_ID: ${{ secrets.ORG_ID }}
        run: snyk test --file=requirements.txt --org=$ORG_ID --sarif-file-output=snyk-sca.sarif

      - name: Snyk Code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          ORG_ID: ${{ secrets.ORG_ID }}
        run: snyk code test --sarif --org=$ORG_ID > snyk-code.sarif

      - name: Snyk Open Source monitor
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          ORG_ID: ${{ secrets.ORG_ID }}
        run: snyk monitor --file=requirements.txt --org=$ORG_ID

      - name: Upload SCA results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Upload SAST results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
